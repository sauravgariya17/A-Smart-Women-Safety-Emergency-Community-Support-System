server:
  port: 8080

spring:
  application:
    name: gehu-women-safety

  datasource:
    url: jdbc:mysql://localhost:3306/gehu_safety_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: root
    password: Saurav@17
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # Use 'update' during development. Switch to 'validate' once schema.sql is the source of truth.
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  # Only read if app.notification.email-enabled=true. Left as placeholder
  # otherwise - the app must not crash if these are unset, since simulation
  # mode doesn't need them (handled by try/catch in EmailNotificationService).
  mail:
    host: smtp.gmail.com
    port: 587
    username: your_email@gmail.com
    password: your_app_password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Custom application properties (bound via JwtProperties)
app:
  jwt:
    # In production, load this from an environment variable, never commit a real secret.
    secret: "CHANGE_THIS_TO_A_LONG_RANDOM_BASE64_SECRET_MIN_256_BITS_FOR_HS256"
    access-token-expiry-ms: 900000        # 15 minutes
    refresh-token-expiry-ms: 604800000    # 7 days

  cors:
    allowed-origins: "http://localhost:5173,http://localhost:3000"

  map:
    # GEHU Clement Town campus + a small surrounding radius ONLY.
    # Any coordinate outside this box is rejected by JourneyService/MapService -
    # this is what keeps the platform campus-scoped, not just a UI convention.
    center-lat: 30.2675
    center-lng: 77.9959
    bounds-radius-km: 2.0
    journey-checkin-grace-minutes: 15

  sos:
    confirmation-window-seconds: 8   # how long PENDING_CONFIRMATION is valid before auto-cancel

  notification:
    # If false (default), all notifications are logged as CONSOLE_SIMULATION -
    # a real, auditable row in notification_logs - but no real email is sent.
    # Set true + configure spring.mail.* above to actually send emails.
    email-enabled: false

logging:
  level:
    com.gehu.safety: DEBUG
    org.springframework.security: INFO
